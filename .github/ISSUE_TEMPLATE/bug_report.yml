name: Report a broken research workflow
description: Help reproduce a CLI, MCP or browser-adapter problem.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Share only redacted details. Never upload browser profiles, cookies, runtime tokens or private account evidence."
  - type: textarea
    id: workflow
    attributes:
      label: What were you trying to do?
      description: Include the command or MCP tool and expected result.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: What happened?
      description: Include a redacted error and whether retrying once reproduced it.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Package version, OS, Node and Chrome versions.
    validations:
      required: true
